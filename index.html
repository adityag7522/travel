<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Travel packages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2a41;--paper:#fafaf7;--teal:#0f6b6b;--saffron:#e08a00;--muted:#5b6572;--line:#dfe3e6}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 'Instrument Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.1;letter-spacing:-.02em}
a{color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 5vw;border-bottom:1px solid var(--line);font:700 1.1rem 'Bricolage Grotesque',sans-serif}
.top a{text-decoration:none}.adm{font:400 .85rem 'Instrument Sans',sans-serif;color:var(--muted)}
main{max-width:1100px;margin:0 auto;padding:0 5vw 64px}.narrow{max-width:760px}
.hero{padding:56px 0 36px;max-width:720px}.hero h1{font-size:clamp(2.2rem,6vw,3.6rem);margin:0 0 14px}.hero p{color:var(--muted);font-size:1.1rem;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:26px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.cover{display:block;aspect-ratio:4/3;background:linear-gradient(135deg,var(--teal),var(--ink)) center/cover}.cover.big{aspect-ratio:16/7;border-radius:6px;margin:28px 0 20px}
.pad{padding:16px 20px 20px;display:flex;flex-direction:column;gap:6px;flex:1}.pad h2{font-size:1.35rem;margin:0}.pad h2 a{text-decoration:none}.pad p{margin:0}
.meta{color:var(--teal);font-weight:600;font-size:.92rem}
.wa,.btn{display:inline-block;margin-top:auto;padding:11px 18px;background:var(--teal);color:#fff;border:0;border-radius:4px;text-decoration:none;font:600 1rem 'Instrument Sans',sans-serif;cursor:pointer;align-self:flex-start}
.wa:hover,.btn:hover{background:#0b5555}.wa:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);padding:5px 10px;font-size:.85rem}
.days{padding-left:20px}.days p{margin:2px 0 8px;color:var(--muted)}.empty{color:var(--muted);padding:24px 0}
form label{display:block;margin:0 0 14px;font-weight:600;font-size:.92rem}
input,textarea,select{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:4px;font:inherit;background:#fff}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.err{color:#b00020}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px}.stat b{display:block;font:700 1.8rem 'Bricolage Grotesque',sans-serif}
.bar{display:grid;grid-template-columns:minmax(120px,220px) 1fr 70px;gap:10px;align-items:center;margin:6px 0;font-size:.92rem}
.bar i{display:block;height:12px;background:var(--teal);border-radius:2px}.bar i.s{background:var(--saffron);height:6px;margin-top:2px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.pill{padding:2px 8px;border-radius:10px;background:var(--line);font-size:.8rem}.pill.published{background:#d3efe6;color:#0b5555}
ul.l{padding:0;list-style:none;margin:0}ul.l li{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
</style></head><body>
<header class="top"><a href="#/" id="brand">Travel packages</a><a href="#/admin" class="adm">Admin</a></header>
<div id="app"><p class="empty" style="padding:24px 5vw">Loading…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js"></script>
<script>
// 1) Paste your Supabase values here (Project Settings > API).
const CFG={url:'https://uezdrbpkdetdcsrjshht.supabase.co',key:'sb_publishable_Esky6tj2BFaW8Di6_F7JFg__9NqIxBX'};

const $=id=>document.getElementById(id), app=$('app');
if(CFG.url.startsWith('PASTE')){app.innerHTML='<main class="narrow"><h1>Almost there</h1><p>Add your Supabase URL and anon key at the top of this file.</p></main>';throw new Error('not configured')}
const sb=supabase.createClient(CFG.url,CFG.key);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slugify=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const S={wa:'',name:'Your Travel Co.'};
const PUB='id,ref_code,slug,title,destination,state,duration_days,summary,itinerary,inclusions,cover_image_url,whatsapp_message';
const meta=p=>[p.destination,p.state,p.duration_days&&p.duration_days+' days'].filter(Boolean).join(', ');
const cover=(p,c='')=>`<div class="cover ${c}" ${p.cover_image_url?`style="background-image:url('${esc(p.cover_image_url)}')"`:''}></div>`;
const waLink=p=>`https://wa.me/${S.wa}?text=`+encodeURIComponent(p.whatsapp_message.replaceAll('{{title}}',p.title).replaceAll('{{ref}}',p.ref_code));
window.trk=id=>{try{const s=localStorage.sid||(localStorage.sid=crypto.randomUUID());
 sb.from('inquiry_clicks').insert({package_id:id,session_id:s,utm_source:new URLSearchParams(location.search).get('utm_source'),device:/mobi/i.test(navigator.userAgent)?'mobile':'desktop'}).then(()=>{})}catch(e){}};
const waBtn=p=>S.wa?`<a class="wa" href="${waLink(p)}" target="_blank" rel="noopener" onclick="trk('${p.id}')">Ask for price on WhatsApp</a>`:'';

async function settings(){
 const{data}=await sb.from('settings').select('*').eq('id',1).maybeSingle();
 if(data){S.wa=data.whatsapp_number||'';S.name=data.site_name||S.name}
 $('brand').textContent=S.name;document.title=S.name}

/* ---------- Public site ---------- */
async function home(){
 const{data,error}=await sb.from('packages').select(PUB).eq('status','published').order('display_order');
 if(error)return app.innerHTML='<main><p class="empty">Could not load packages. Check the Supabase URL and key.</p></main>';
 app.innerHTML=`<main><section class="hero"><h1>Trips across India, planned by people who go there.</h1><p>Pick a package, tap the button, and we’ll share the price and dates on WhatsApp.</p></section>
 ${data.length?'':'<p class="empty">No packages are live yet. Check back soon.</p>'}
 <div class="grid">${data.map(p=>`<article class="card"><a href="#/p/${esc(p.slug)}">${cover(p)}</a><div class="pad"><h2><a href="#/p/${esc(p.slug)}">${esc(p.title)}</a></h2><p class="meta">${esc(meta(p))}</p><p>${esc(p.summary)}</p>${waBtn(p)}</div></article>`).join('')}</div></main>`}

async function detail(slug){
 const{data:p}=await sb.from('packages').select(PUB).eq('slug',slug).eq('status','published').maybeSingle();
 if(!p)return app.innerHTML='<main><p class="empty">This package isn’t available. <a href="#/">See all packages</a></p></main>';
 app.innerHTML=`<main class="narrow"><a href="#/">← All packages</a>${cover(p,'big')}<h1>${esc(p.title)}</h1><p class="meta">${esc(meta(p))}</p><p>${esc(p.summary)}</p>${waBtn(p)}
 ${p.itinerary.length?`<h2>Itinerary</h2><ol class="days">${p.itinerary.map(d=>`<li><strong>${esc(d.title)}</strong><p>${esc(d.details)}</p></li>`).join('')}</ol>`:''}
 ${p.inclusions.length?`<h2>What’s included</h2><ul>${p.inclusions.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:''}</main>`}

/* ---------- Admin ---------- */
async function admin(h){
 const{data:{session}}=await sb.auth.getSession();
 if(!session)return login();
 const{data:a}=await sb.from('admins').select('user_id').maybeSingle();
 if(!a)return app.innerHTML='<main class="narrow"><h1>No admin access</h1><p>This account isn’t listed as an admin.</p><button class="btn" onclick="logout()">Log out</button></main>';
 const m=h.match(/^\/admin\/edit\/(.+)$/);return m?edit(m[1]):dash()}

function login(){
 app.innerHTML='<main class="narrow"><h1>Admin login</h1><form id="lf"><label>Email<input name="e" type="email" required></label><label>Password<input name="p" type="password" required></label><button class="btn">Log in</button><p id="err" class="err"></p></form></main>';
 $('lf').onsubmit=async e=>{e.preventDefault();const f=new FormData($('lf'));
  const{error}=await sb.auth.signInWithPassword({email:f.get('e'),password:f.get('p')});
  error?$('err').textContent=error.message:route()}}
window.logout=async()=>{await sb.auth.signOut();location.hash='#/';route()};

async function dash(){
 const since=new Date(Date.now()-30*864e5).toISOString(),d7=Date.now()-7*864e5;
 const[{data:pk},{data:ck}]=await Promise.all([
  sb.from('packages').select('id,ref_code,title,status,display_order').order('display_order'),
  sb.from('inquiry_clicks').select('package_id,clicked_at,utm_source,device').gte('clicked_at',since).limit(10000)]);
 const st={};pk.forEach(p=>st[p.id]={c7:0,c30:0});const src={},dev={};let t7=0,t30=0;
 (ck||[]).forEach(c=>{const s=st[c.package_id];if(!s)return;s.c30++;t30++;if(new Date(c.clicked_at)>d7){s.c7++;t7++}
  const k=c.utm_source||'direct';src[k]=(src[k]||0)+1;dev[c.device]=(dev[c.device]||0)+1});
 const top=[...pk].sort((a,b)=>st[b.id].c30-st[a.id].c30),max=Math.max(1,...top.map(p=>st[p.id].c30));
 const list=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<li>${esc(k)}<b>${v}</b></li>`).join('')||'<li>No data yet</li>';
 app.innerHTML=`<main><div style="display:flex;justify-content:space-between;align-items:center"><h1>Dashboard</h1><button class="btn ghost" onclick="logout()">Log out</button></div>
 <div class="stats"><div class="stat"><b>${t7}</b>WhatsApp clicks, last 7 days</div><div class="stat"><b>${t30}</b>Clicks, last 30 days</div><div class="stat"><b>${t30?esc(top[0].title):'-'}</b>Most responses (30 days)</div></div>
 <h2>Responses by package</h2>${top.map(p=>`<div class="bar"><span>${esc(p.title)}</span><div><i style="width:${st[p.id].c30/max*100}%"></i><i class="s" style="width:${st[p.id].c7/max*100}%"></i></div><span>${st[p.id].c30} / ${st[p.id].c7}</span></div>`).join('')||'<p class="empty">No packages yet.</p>'}
 <p class="meta">Teal: 30 days. Orange: 7 days. A click means the visitor opened WhatsApp, not that they sent the message.</p>
 <div class="two"><div><h3>Traffic source</h3><ul class="l">${list(src)}</ul></div><div><h3>Device</h3><ul class="l">${list(dev)}</ul></div></div>
 <div style="display:flex;justify-content:space-between;align-items:center;margin-top:36px"><h2>Packages</h2><a class="btn" href="#/admin/edit/new">New package</a></div>
 <div class="tw"><table><tr><th>Ref</th><th>Title</th><th>Status</th><th>Order</th><th></th></tr>${pk.map(p=>`<tr><td>${esc(p.ref_code)}</td><td>${esc(p.title)}</td><td><span class="pill ${p.status}">${p.status}</span></td><td>${p.display_order}</td>
 <td><a class="btn ghost" href="#/admin/edit/${p.id}">Edit</a> <button class="btn ghost" onclick="togg('${p.id}','${p.status}')">${p.status==='published'?'Unpublish':'Publish'}</button> <button class="btn ghost" onclick="del('${p.id}')">Delete</button></td></tr>`).join('')}</table></div>
 <h2 style="margin-top:36px">Site settings</h2><form onsubmit="event.preventDefault();saveSet()"><div class="row"><label>WhatsApp number (country code, digits only)<input id="wan" placeholder="919876543210" value="${esc(S.wa)}"></label><label>Site name<input id="sn" value="${esc(S.name)}"></label></div><button class="btn">Save settings</button></form></main>`}

window.togg=async(id,s)=>{const{error}=await sb.from('packages').update({status:s==='published'?'draft':'published',updated_at:new Date().toISOString()}).eq('id',id);error?alert(error.message):dash()};
window.del=async id=>{if(!confirm('Delete this package and its click history?'))return;const{error}=await sb.from('packages').delete().eq('id',id);error?alert(error.message):dash()};
window.saveSet=async()=>{const{error}=await sb.from('settings').upsert({id:1,whatsapp_number:$('wan').value.replace(/\D/g,''),site_name:$('sn').value});
 if(error)return alert(error.message);await settings();alert('Settings saved')};

async function edit(id){
 let p={status:'draft',display_order:0,itinerary:[],inclusions:[],whatsapp_message:"Hi! I'm interested in {{title}} (Ref: {{ref}}). Could you share the price and availability?"},price='';
 if(id!=='new'){const{data}=await sb.from('packages').select('*').eq('id',id).single();p=data;
  const{data:pr}=await sb.from('package_pricing').select('price_notes').eq('package_id',id).maybeSingle();price=pr?.price_notes||''}
 app.innerHTML=`<main class="narrow"><a href="#/admin">← Back to dashboard</a><h1>${id==='new'?'New package':'Edit package'}</h1><form id="pf">
 <label>Title<input name="title" required value="${esc(p.title)}"></label>
 <div class="row"><label>Destination<input name="destination" required value="${esc(p.destination)}"></label><label>State<input name="state" value="${esc(p.state)}"></label><label>Days<input name="duration_days" type="number" min="1" value="${esc(p.duration_days)}"></label></div>
 <label>Summary<textarea name="summary" rows="3">${esc(p.summary)}</textarea></label>
 <label>Itinerary (one day per line: Title | details)<textarea name="itin" rows="5">${esc(p.itinerary.map(d=>d.title+' | '+d.details).join('\n'))}</textarea></label>
 <label>Inclusions (one per line)<textarea name="inc" rows="4">${esc(p.inclusions.join('\n'))}</textarea></label>
 <label>Cover image<input name="file" type="file" accept="image/*"></label>
 <label>Or image URL<input name="cover" value="${esc(p.cover_image_url)}"></label>
 <div class="row"><label>Status<select name="status">${['draft','published','archived'].map(s=>`<option ${s===p.status?'selected':''}>${s}</option>`).join('')}</select></label><label>Display order (lower shows first)<input name="display_order" type="number" value="${p.display_order}"></label></div>
 <label>WhatsApp message (use {{title}} and {{ref}})<textarea name="msg" rows="3">${esc(p.whatsapp_message)}</textarea></label>
 <label>Price notes (private, never shown on the site)<textarea name="price" rows="2">${esc(price)}</textarea></label>
 <button class="btn">Save package</button><p id="err" class="err"></p></form></main>`;
 $('pf').onsubmit=async e=>{e.preventDefault();const f=new FormData($('pf')),btn=e.submitter;btn.disabled=true;
  try{
   let img=f.get('cover')||null;const file=f.get('file');
   if(file&&file.size){const path=crypto.randomUUID()+'-'+file.name.replace(/[^\w.-]/g,'_');
    const{error}=await sb.storage.from('covers').upload(path,file);if(error)throw error;
    img=sb.storage.from('covers').getPublicUrl(path).data.publicUrl}
   const lines=k=>f.get(k).split('\n').map(l=>l.trim()).filter(Boolean);
   const row={title:f.get('title'),slug:p.slug||slugify(f.get('title')),destination:f.get('destination'),state:f.get('state')||null,
    duration_days:f.get('duration_days')||null,summary:f.get('summary'),
    itinerary:lines('itin').map((l,i)=>{const[t,...r]=l.split('|');return{day:i+1,title:t.trim(),details:r.join('|').trim()}}),
    inclusions:lines('inc'),cover_image_url:img,status:f.get('status'),display_order:+f.get('display_order')||0,
    whatsapp_message:f.get('msg'),updated_at:new Date().toISOString()};
   const q=id==='new'?sb.from('packages').insert(row):sb.from('packages').update(row).eq('id',id);
   const{data,error}=await q.select('id').single();if(error)throw error;
   const{error:pe}=await sb.from('package_pricing').upsert({package_id:data.id,price_notes:f.get('price')});if(pe)throw pe;
   location.hash='#/admin';
  }catch(x){$('err').textContent=x.message;btn.disabled=false}}}

/* ---------- Router ---------- */
async function route(){const h=location.hash.slice(1)||'/';window.scrollTo(0,0);
 if(h.startsWith('/admin'))return admin(h);
 if(h.startsWith('/p/'))return detail(decodeURIComponent(h.slice(3)));
 return home()}
addEventListener('hashchange',route);
settings().catch(()=>{}).finally(route);
</script></body></html>
